<?xml version="1.0" encoding="UTF-8"?>
<!-- 蜀韵•成都 Logo：可爱的小熊猫头像 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 耳朵（外层红棕，内层奶白） -->
  <circle cx="24" cy="30" r="13" fill="#C8643B"/>
  <circle cx="76" cy="30" r="13" fill="#C8643B"/>
  <circle cx="24" cy="32" r="6" fill="#FFF8E6"/>
  <circle cx="76" cy="32" r="6" fill="#FFF8E6"/>
  <!-- 脸部主体 -->
  <ellipse cx="50" cy="56" rx="38" ry="33" fill="#E07B3F"/>
  <!-- 奶白色面颊 -->
  <ellipse cx="50" cy="66" rx="27" ry="18" fill="#FFF8E6"/>
  <!-- 眼睛下方的泪痕花纹 -->
  <path d="M34 54 Q30 66 36 72 Q36 62 38 56 Z" fill="#9A4A22"/>
  <path d="M66 54 Q70 66 64 72 Q64 62 62 56 Z" fill="#9A4A22"/>
  <!-- 眼睛 -->
  <circle cx="37" cy="52" r="5" fill="#3B2314"/>
  <circle cx="63" cy="52" r="5" fill="#3B2314"/>
  <circle cx="38.8" cy="50.2" r="1.7" fill="#FFFFFF"/>
  <circle cx="64.8" cy="50.2" r="1.7" fill="#FFFFFF"/>
  <!-- 鼻子与嘴巴 -->
  <ellipse cx="50" cy="63" rx="5" ry="3.5" fill="#3B2314"/>
  <path d="M50 66 Q50 72 44 72 M50 66 Q50 72 56 72" fill="none" stroke="#3B2314" stroke-width="2" stroke-linecap="round"/>
  <!-- 腮红 -->
  <circle cx="30" cy="66" r="4" fill="#FFB3A7" opacity="0.8"/>
  <circle cx="70" cy="66" r="4" fill="#FFB3A7" opacity="0.8"/>
</svg>
